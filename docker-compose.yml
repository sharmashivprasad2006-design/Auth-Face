version: '3.8'

services:
  # 1. MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: shieldauth-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: shieldauth
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - shieldauth-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Node.js Backend API Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shieldauth-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/shieldauth
      CLIENT_ORIGIN: http://localhost:80,http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-shieldauth_prod_access_secret_99881122334455667788}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-shieldauth_prod_refresh_secret_11223344556677889900}
      JWT_REFRESH_EXPIRES_IN: 7d
      OTP_EXPIRY_MINUTES: 5
      OTP_COOLDOWN_SECONDS: 60
      OTP_MAX_ATTEMPTS: 3
      EMAIL_DELIVERY_MODE: json
      SMS_PROVIDER: console
      BIOMETRIC_EUCLIDEAN_THRESHOLD: 0.40
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - shieldauth-net

  # 3. React Frontend Client Service (Static Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: shieldauth-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - shieldauth-net

volumes:
  mongo-data:
    driver: local

networks:
  shieldauth-net:
    driver: bridge
